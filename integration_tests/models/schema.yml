version: 2

models:
  - name: orders_base
    description: "Base orders table seeded from orders_seed."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: region
        tests:
          - not_null

  - name: orders_semantic_view
    description: "Semantic view over orders_base, referenced by agent_with_semantic_view."

  - name: agent_minimal
    description: "Cortex Agent with instructions only (no tools)."

  - name: agent_with_semantic_view
    description: "Cortex Agent whose Analyst tool references orders_semantic_view."

  - name: agent_raw_ddl
    description: "Cortex Agent created via raw_ddl pass-through mode."

  - name: agent_with_search
    description: "Cortex Agent with a Cortex Search tool; verifies full tool_resources syntax including filter, max_results, title_column, id_column."

  - name: agent_with_analytical_search
    description: "Cortex Agent with analytical_search=true and budget set; verifies that both configs are merged into a single orchestration: block via YAML parse-and-merge."

  - name: forecaster_skill
    description: "Cortex skill whose directory (SKILL.md + any companion scripts) is uploaded to a named stage by the cortex_skill materialization."

  - name: agent_with_skill
    description: "Cortex Agent that references forecaster_skill via the skills array; depends_on ensures the skill file is deployed first."

  - name: agent_versioned
    description: "Cortex Agent with versioning=true. Compiles to CREATE AGENT ... FROM SPECIFICATION (first-run form of the live-version workflow). Compile-path test only."

  - name: example_mcp_api_integration
    description: "Generic Snowflake API integration fixture. Created by the cortex_mcp_api_integration materialization. Exercises structural compilation only, not tied to a real MCP endpoint."

  - name: example_mcp_server
    description: "External MCP Server object wired to example_mcp_api_integration via ref(). Created by the cortex_mcp_server materialization."

  - name: agent_with_mcp_server
    description: "Cortex Agent that references example_mcp_server via cortex_mcp_server_name(ref(...)). Verifies DAG wiring and mcp_servers: spec injection."

  - name: agent_eval_target
    description: "Tool-free Cortex Agent that agent_eval evaluates."

  - name: agent_eval
    description: "Evaluation config for agent_eval_target, written to a named stage by the cortex_agent_eval materialization. Its dataset: block registers the agent_eval_questions seed as an evaluation dataset. Does not start a run."

  - name: agent_with_code_execution
    description: "Cortex Agent with code_execution_tool=true (boolean shorthand). Verifies that the tool and an empty tool_resources.code_execution entry are injected into the spec."

  - name: agent_with_code_execution_options
    description: "Cortex Agent with code_execution_tool map form (permission_policy + artifact_repositories) combined with an existing tools: block. Verifies that both tool entries and both tool_resources entries are present with no duplicate keys."
