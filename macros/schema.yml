version: 2

macros:
  - name: snowflake__create_or_replace_cortex_agent
    description: >
      Orchestrates the CREATE OR REPLACE AGENT statement for a model using the
      `cortex_agent` materialization. Runs pre/post hooks and returns the
      target relation. Called internally by the materialization — not intended
      for direct use.

  - name: snowflake__get_create_cortex_agent_sql
    description: >
      Produces the DDL string that creates a Cortex Agent. Operates in two
      modes controlled by the `raw_ddl` model config:

      - Specification mode (default, `raw_ddl=false`): wraps the model body in
        `FROM SPECIFICATION $$ ... $$`, emits the optional `COMMENT` and
        `PROFILE` clauses from config, and prepends any `model` / `budget`
        config values as YAML inside the spec body.

      - Raw DDL mode (`raw_ddl=true`): treats the model body as everything
        following `CREATE OR REPLACE AGENT <name>` and passes it through
        verbatim to Snowflake.
    arguments:
      - name: relation
        type: SnowflakeRelation or string
        description: The fully-qualified agent name used in the DDL.
      - name: sql
        type: string
        description: The compiled body of the dbt model.

  - name: snowflake__get_drop_cortex_agent_sql
    description: >
      Returns the `DROP AGENT IF EXISTS` DDL string for the given relation.
    arguments:
      - name: relation
        type: SnowflakeRelation
        description: The agent relation to drop.

  - name: snowflake__get_cortex_agent_rename_sql
    description: >
      Returns the `ALTER AGENT ... RENAME TO` DDL string.
    arguments:
      - name: relation
        type: SnowflakeRelation
        description: The agent relation to rename.
      - name: new_name
        type: SnowflakeRelation or string
        description: The new name for the agent.

  - name: cortex_skill__resolve_skill_dir
    description: >
      Finds the sibling skill directory for the current cortex_skill model and
      returns its absolute path. The directory must have the same base name as
      the .sql model (e.g. models/skills/my_skill/ alongside
      models/skills/my_skill.sql) and must contain at least a SKILL.md file.
      Raises a compiler error if the directory or SKILL.md is missing.
      Called internally — not intended for direct use.

  - name: snowflake__create_or_replace_cortex_skill
    description: >
      Orchestrates uploading all files in the sibling skill directory to a
      Snowflake stage for a model using the `cortex_skill` materialization.
      Creates the stage with CREATE STAGE IF NOT EXISTS, then runs pre/post
      hooks around the PUT statement. Called internally by the materialization
      — not intended for direct use.

  - name: snowflake__get_create_cortex_skill_sql
    description: >
      Produces the PUT statement that uploads all files in the skill directory
      to the stage using a wildcard. PUT gives exact filename control, avoiding
      the suffix that COPY INTO appends to output files.
    arguments:
      - name: relation
        type: SnowflakeRelation or string
        description: The relation representing this skill node (used for context).
      - name: skill_dir
        type: string
        description: Absolute local path to the sibling skill directory.
      - name: skill_path
        type: string
        description: >
          Fully-qualified stage path prefix,
          e.g. '@my_db.my_schema.skill_stage/skills/forecaster_skill'.

  - name: cortex_skill_path
    description: >
      Returns the stage path for a cortex_skill model given its ref(), for use
      in a cortex_agent's skills: section. Calling ref() as the argument
      registers the DAG dependency (agent is created after the skill file is
      uploaded) and the macro looks up the skill model's stage config from the
      graph so no var() or hard-coded path is needed. Must be called inside an
      execute=True context; returns a placeholder during parse time.
    arguments:
      - name: skill_ref
        type: Relation
        description: >
          The Relation returned by ref() for the cortex_skill model, e.g.
          ref('forecaster_skill').

  - name: snowflake__get_drop_cortex_skill_sql
    description: >
      No-op. Skills are stage files with no SQL DROP statement. To remove a
      skill's file, run REMOVE @<stage>/skills/<name>/SKILL.md manually.
    arguments:
      - name: relation
        type: SnowflakeRelation
        description: The skill relation to drop (unused).

  - name: snowflake__get_cortex_skill_rename_sql
    description: >
      No-op. Skills are stage files; renaming requires COPY FILES + REMOVE
      executed manually on the stage.
    arguments:
      - name: relation
        type: SnowflakeRelation
        description: The skill relation to rename (unused).
      - name: new_name
        type: SnowflakeRelation or string
        description: The new name (unused).

  - name: cortex_agent_quote_string
    description: >
      Wraps a value in single quotes for use as a SQL string literal, escaping
      any embedded single quotes by doubling them.
    arguments:
      - name: value
        type: string
        description: 'The value to quote. Example: "Sales assistant"'

  - name: cortex_agent_render_model_and_budget
    description: >
      Renders the `models:` and `orchestration:` YAML blocks that are prepended
      to the spec body when the `model` and/or `budget` materialization configs
      are set. Returns an empty string when both inputs are none, so it is safe
      to call unconditionally.
    arguments:
      - name: model
        type: string or none
        description: >
          The orchestration model name, e.g. 'claude-opus-4'. Produces
          `models:\n  orchestration: <value>` in the spec YAML.
      - name: budget
        type: int, float, dict, or none
        description: >
          Spending limit for the orchestrator. A plain number is shorthand for
          {seconds: <value>}. A dict may contain `seconds` and/or `tokens` keys.
          Produces an `orchestration:\n  budget:` block in the spec YAML.

  - name: cortex_agent_render_profile
    description: >
      Renders the PROFILE clause value. Accepts either a dict (serialized to
      JSON automatically) or a pre-serialized JSON string. Returns a quoted SQL
      string literal suitable for use in `PROFILE = ...`.
    arguments:
      - name: profile
        type: dict or string
        description: >
          Agent profile configuration. Example as dict:
          {'display_name': 'Sales Assistant', 'avatar': 'icon.png', 'color': 'blue'}
