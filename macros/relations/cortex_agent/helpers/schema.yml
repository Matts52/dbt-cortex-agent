version: 2

macros:
  - name: _cortex_agent_exists
    description: >
      Returns true if the named Cortex Agent already exists in Snowflake, using
      SHOW AGENTS + RESULT_SCAN. Returns false at parse time (execute=False).
      Internal helper — not intended for direct use.
    arguments:
      - name: relation
        type: relation
        description: The agent relation to check.

  - name: _cortex_agent_versions
    description: >
      Summarises an agent's versions using SHOW VERSIONS IN AGENT + RESULT_SCAN,
      comparing specs by md5. Returns a dict with has_live, live_hash,
      last_name, last_hash, default_name and aliases ({ALIAS: VERSION$n}).
      Returns empty values at parse time (execute=False).
      Internal helper — not intended for direct use.
    arguments:
      - name: relation
        type: string
        description: The fully-qualified agent name.

  - name: _cortex_agent_auto_version_name
    description: >
      Generates a deterministic version alias from run_started_at in the format
      v_YYYYMMDD_HHMMSS. All models versioned in the same dbt run share one
      alias. Returns a placeholder string during parse time.
      Internal helper — not intended for direct use.
